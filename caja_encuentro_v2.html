<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d0d">
<title>Caja · XXI Encuentro Nacional de Mini Básquet</title>
<style>
:root{
  --bg:#0d0d0d; --card:#1a1a1a; --card2:#242424; --line:#2f2f2f;
  --red:#c8102e; --red2:#e0243f; --gold:#d9a521; --txt:#f4f1ea; --mut:#9b9b9b;
  --ok:#3ecf8e; --bad:#ff6363;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{min-height:100dvh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer}
.hd{background:linear-gradient(135deg,var(--red) 0%,#7d0a1c 60%,#1a1a1a 100%);padding:calc(14px + env(safe-area-inset-top)) 16px 16px;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--gold)}
.hd .esc{flex:0 0 46px}
.hd h1{margin:0;font-size:16px;line-height:1.15;font-weight:800;letter-spacing:.2px}
.hd p{margin:3px 0 0;font-size:12px;color:#ffd9de;opacity:.9}
.hd .ver{font-size:10px;color:#ffd9de;opacity:.7}
main{padding:14px;max-width:640px;margin:0 auto}

/* balance */
.bal{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.bal>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.bal small{display:block;color:var(--mut);font-size:12px;margin-bottom:4px}
.bal b{font-size:20px}
.bal .sal{grid-column:1/3;background:linear-gradient(90deg,#2a0a10,#1a1a1a);border-color:var(--gold)}
.bal .sal b{font-size:28px;color:var(--gold)}
.pos{color:var(--ok)} .neg{color:var(--bad)}

.big{display:block;width:100%;border:0;border-radius:18px;padding:22px 16px;font-size:24px;font-weight:800;color:#fff;margin-bottom:12px;letter-spacing:.3px}
.big.in{background:linear-gradient(135deg,var(--red2),var(--red));box-shadow:0 4px 0 #7d0a1c}
.big.out{background:linear-gradient(135deg,#333,#1e1e1e);border:2px solid var(--gold);color:var(--gold);box-shadow:0 4px 0 #000}
.big:active{transform:translateY(3px);box-shadow:none}
h3.sec{margin:20px 2px 8px;font-size:14px;color:var(--gold);font-weight:700}

/* pantalla de áreas */
.top{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.top h2{margin:0;font-size:20px;flex:1;line-height:1.1}
.top h2 small{display:block;font-size:12px;color:var(--mut);font-weight:400;margin-top:3px}
.back,.edit{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:10px 12px;font-size:14px}
.edit.on{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 8px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:150px;justify-content:center}
.tile:active{background:var(--card2);border-color:var(--red)}
.tile .tn{font-weight:700;font-size:15px;line-height:1.15}
.tile .tt{font-size:13px;color:var(--gold);font-weight:700}
.tile.ed{border:2px dashed var(--gold)}
.tile .x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;font-size:14px;line-height:28px}
.tile.add{border:2px dashed var(--mut);color:var(--mut)}
.tile .plus{font-size:44px;line-height:1;color:var(--gold)}

/* movimientos */
.mv{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.mv .mb{flex:1;min-width:0}
.mv .mb b{display:block;font-size:15px}
.mv .mb small{display:block;color:var(--mut);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .ma{font-weight:800;font-size:16px;white-space:nowrap}
.chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:20px;padding:8px 14px;font-size:13px}
.chip.on{background:var(--red);border-color:var(--red);font-weight:700}
.empty{text-align:center;color:var(--mut);padding:30px 10px;font-size:14px}

/* resumen */
.tb{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 12px;margin-bottom:10px}
.tb .r{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.tb .r:last-child{border:0}
.tb .r span:first-child small{color:var(--mut);margin-left:6px}
.tb .r.tot{font-weight:800}
.acts{display:grid;gap:10px;margin-top:14px}

/* botones / inputs */
.btn{display:block;width:100%;text-align:center;text-decoration:none;background:var(--red);color:#fff;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700}
.btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--txt)}
.btn.gold{background:var(--gold);color:#111}
.btn.del{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn.sm{padding:9px;font-size:13px;width:auto;display:inline-block}
.btn:disabled{opacity:.5}
.inp{width:100%;background:#111;border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:13px;font-size:16px;font-family:inherit;margin-bottom:12px}
.inp:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.inp.big{font-size:28px;font-weight:800;color:var(--gold)}
label{display:block;font-size:12px;color:var(--mut);margin:0 2px 5px}
.row{display:flex;gap:10px;margin-top:6px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:94dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));border-top:3px solid var(--gold);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.fh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.fh small{color:var(--gold);font-size:12px;font-weight:700}
.fh h3{margin:2px 0 0;font-size:19px}
.fh div{flex:1}
.x2{background:var(--card2);border:0;color:var(--txt);width:36px;height:36px;border-radius:50%;font-size:16px}
.pchips{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.pchips button{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:16px;padding:6px 11px;font-size:13px}
.fp{display:flex;align-items:center;gap:12px;margin-top:10px}
.fp img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.fimg{width:100%;border-radius:12px;margin:10px 0;border:1px solid var(--line)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span:first-child{color:var(--mut)}
.ipick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.ipick .ic{background:var(--card2);border:2px solid transparent;border-radius:12px;padding:8px;display:flex;justify-content:center}
.ipick .ic.sel{border-color:var(--gold);background:#2a0a10}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:#121212;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:40}
.nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 4px 9px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button span{font-size:20px;line-height:1}
.nav button.on{color:var(--gold);font-weight:700}

.hr{margin-left:auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px;align-self:flex-start}
.hr .ver{margin:0}
.st{border:0;border-radius:14px;padding:5px 10px;font-size:11px;font-weight:700;color:#111;background:#888;white-space:nowrap}
.st.ok{background:var(--ok)} .st.warn{background:var(--gold)} .st.bad{background:var(--bad)} .st.off{background:#777;color:#fff}
.ro{background:#1f1a0a;border:1px solid var(--gold);color:var(--gold);border-radius:14px;padding:14px;font-size:14px;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#111;padding:11px 18px;border-radius:24px;font-weight:700;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>

<header class="hd">
  <svg class="esc" viewBox="0 0 64 72" width="46" height="52" aria-hidden="true">
    <path d="M32 3 58 12v26c0 16-11 26-26 31C17 64 6 54 6 38V12z" fill="#0d0d0d" stroke="#d9a521" stroke-width="3"/>
    <path d="M32 9 52 16v22c0 12-8 20-20 25C20 58 12 50 12 38V16z" fill="#c8102e"/>
    <circle cx="32" cy="34" r="12" fill="none" stroke="#d9a521" stroke-width="2.5"/>
    <path d="M20 34h24M32 22v24M24 25c5 5 5 13 0 18M40 25c-5 5-5 13 0 18" fill="none" stroke="#d9a521" stroke-width="2"/>
  </svg>
  <div>
    <h1>XXI Encuentro Nacional de Mini Básquet</h1>
    <p>Club Independiente de Tandil · Caja del fin de semana</p>
  </div>
  <div class="hr"><span class="ver">v2.1</span><button class="st off" id="st" onclick="syncNow()">…</button></div>
</header>
<iframe name="upif" id="upif" style="display:none" title="subida"></iframe>

<main id="app"></main>

<nav class="nav">
  <button data-v="home" onclick="go('home')"><span>🏀</span>Caja</button>
  <button data-v="movs" onclick="go('movs')"><span>📋</span>Movimientos</button>
  <button data-v="resumen" onclick="go('resumen')"><span>📊</span>Resumen</button>
</nav>

<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
/* ============ ÍCONOS (dibujos alusivos) ============ */
const ICONS = {
  burger:`<path d="M10 28c0-10 10-16 22-16s22 6 22 16z" fill="#c8102e"/><circle cx="24" cy="21" r="1.2" fill="#d9a521"/><circle cx="32" cy="17" r="1.2" fill="#d9a521"/><circle cx="40" cy="21" r="1.2" fill="#d9a521"/><path d="M8 35c4 4 8 0 12 0s8 4 12 0 8 4 12 0 8 4 12 0"/><path d="M10 43h44v3a8 8 0 0 1-8 8H18a8 8 0 0 1-8-8z" fill="#c8102e"/>`,
  parrilla:`<path d="M32 5c4 8 13 12 13 23a13 13 0 0 1-26 0c0-6 4-9 5-15 3 3 4 5 5 7 2-4 4-9 3-15z" fill="#c8102e"/><path d="M10 44h44M14 44v13M28 44v13M42 44v13M52 44v13"/>`,
  ticket:`<path d="M8 20h48v8a4 4 0 0 0 0 8v8H8v-8a4 4 0 0 0 0-8z" fill="#c8102e"/><path d="M42 21v22" stroke-dasharray="3 3"/><path d="M20 32h12"/>`,
  estrella:`<polygon points="32,7 39,24 57,25 43,37 48,55 32,45 16,55 21,37 7,25 25,24" fill="#c8102e"/>`,
  stand:`<path d="M8 28 14 10h36l6 18z" fill="#c8102e"/><path d="M8 28a6 6 0 0 0 12 0 6 6 0 0 0 12 0 6 6 0 0 0 12 0 6 6 0 0 0 12 0"/><path d="M12 36v20M52 36v20M10 46h44"/>`,
  pochoclo:`<circle cx="22" cy="22" r="7" fill="#f5e6b3"/><circle cx="32" cy="17" r="8" fill="#f5e6b3"/><circle cx="43" cy="22" r="7" fill="#f5e6b3"/><path d="M15 28h34l-4 28H19z" fill="#c8102e"/><path d="M26 28l1 28M38 28l-1 28" stroke="#111"/>`,
  megafono:`<path d="M10 26h10l24-12v36L20 38H10z" fill="#c8102e"/><path d="M20 38l4 14h8l-3-13"/><path d="M50 24c3 4 3 12 0 16"/><path d="M55 19c6 8 6 18 0 26"/>`,
  recibo:`<path d="M16 8h32v48l-5.3-4-5.4 4-5.3-4-5.3 4-5.4-4L16 56z" fill="#c8102e"/><path d="M24 20h16M24 30h16M24 40h9"/>`,
  mic:`<rect x="24" y="8" width="16" height="28" rx="8" fill="#c8102e"/><path d="M16 30a16 16 0 0 0 32 0M32 46v10M23 56h18"/>`,
  cubiertos:`<path d="M18 8v14a6 6 0 0 0 12 0V8M24 8v48"/><path d="M46 8c-7 6-7 20 0 24v24" fill="#c8102e"/>`,
  moneda:`<circle cx="32" cy="32" r="21" fill="#c8102e"/><path d="M32 18v28M26 25h9a4.5 4.5 0 0 1 0 9h-6a4.5 4.5 0 0 0 0 9h10"/>`,
  basket:`<circle cx="32" cy="32" r="22" fill="#c8102e"/><path d="M10 32h44M32 10v44M16 16c8 8 8 24 0 32M48 16c-8 8-8 24 0 32"/>`,
  bebida:`<path d="M18 16h28l-4 40H22z" fill="#c8102e"/><path d="M14 16h36M35 16l6-10"/><path d="M21 30h22"/>`,
  trofeo:`<path d="M20 10h24v14a12 12 0 0 1-24 0z" fill="#c8102e"/><path d="M20 14h-8v4a8 8 0 0 0 8 8M44 14h8v4a8 8 0 0 1-8 8M32 36v12M22 54h20"/>`,
  camiseta:`<path d="M22 8 8 16l6 12 8-4v32h20V24l8 4 6-12-14-8c-2 5-6 7-10 7s-8-2-10-7z" fill="#c8102e"/>`,
  bolsa:`<path d="M14 22h36l3 34H11z" fill="#c8102e"/><path d="M22 28v-8a10 10 0 0 1 20 0v8"/>`
};
function icon(name,size){
  return `<svg viewBox="0 0 64 64" width="${size}" height="${size}" fill="none" stroke="#d9a521" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||ICONS.moneda}</svg>`;
}

/* ============ CONFIGURACIÓN ============ */
// ⚠️ Pegá acá la URL de la aplicación web (termina en /exec) y la misma clave del Code.gs
const DEFAULT_CFG = { url:'https://script.google.com/macros/s/AKfycbz-XFGMiGMm7oBUCpjj8u5zvEqXaTeJGOLN8gsPu8ta2Ki39VLrobHjrb_V6g6JjeL4/exec', key:'mini21', dev:'', asked:false };
const RO = /[?&#]ver=1/.test(location.search+location.hash);   // link "solo ver"
function loadCfg(){
  let c={}; try{ c=JSON.parse(localStorage.getItem('emb21_cfg'))||{}; }catch(e){}
  const o=Object.assign({},DEFAULT_CFG,c);
  if(!c.url && DEFAULT_CFG.url) o.url=DEFAULT_CFG.url;
  return o;
}
let CFG = loadCfg();
function saveCfg(){ try{ localStorage.setItem('emb21_cfg',JSON.stringify(CFG)); }catch(e){} }

/* ============ DATOS ============ */
const KEY = 'emb21_v2';
function defaults(){
  return {v:2,
    areas:{
      ingreso:[
        {id:'a1',nombre:'Cantina Duggan',icono:'burger'},
        {id:'a2',nombre:'Cantina Lawn-parrilla',icono:'parrilla'},
        {id:'a3',nombre:'Entradas',icono:'ticket'},
        {id:'a4',nombre:'Show',icono:'estrella'},
        {id:'a5',nombre:'Stands',icono:'stand'},
        {id:'a6',nombre:'Pochoclera rojinegra',icono:'pochoclo'},
        {id:'a7',nombre:'Publicidades',icono:'megafono'}
      ],
      egreso:[
        {id:'e1',nombre:'Gastos generales',icono:'recibo'},
        {id:'e2',nombre:'Gastos show',icono:'mic'},
        {id:'e3',nombre:'Gastos cantina',icono:'cubiertos'}
      ]
    },
    movs:[], personas:[], pend:{}, areasDirty:false, srv:0, asrv:0, sheetUrl:''};
}
function normalizar(d){
  const b=defaults(); for(const k in b) if(d[k]===undefined) d[k]=b[k]; return d;
}
function load(){
  for(const k of [KEY, KEY+'_bak']){
    try{ const d=JSON.parse(localStorage.getItem(k)); if(d && d.areas && d.movs) return normalizar(d); }catch(e){}
  }
  return defaults();
}
let S = load();
function save(){
  try{
    const j=JSON.stringify(S);
    localStorage.setItem(KEY,j); localStorage.setItem(KEY+'_bak',j);
  }catch(e){ toast('⚠️ No se pudo guardar en el teléfono'); }
}
const vivos=()=>S.movs.filter(m=>!m.del);

/* Fotos de comprobantes: copia local en IndexedDB, y se suben a Drive */
let db=null;
function openDB(){
  return new Promise(res=>{
    try{
      const r=indexedDB.open('emb21_fotos',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('f');
      r.onsuccess=()=>{db=r.result;res();};
      r.onerror=()=>res();
    }catch(e){res();}
  });
}
function putFoto(id,d){return new Promise(res=>{ if(!db) return res(false); try{const t=db.transaction('f','readwrite'); t.objectStore('f').put(d,id); t.oncomplete=()=>res(true); t.onerror=()=>res(false);}catch(e){res(false);} });}
function getFoto(id){return new Promise(res=>{ if(!db) return res(null); try{const q=db.transaction('f').objectStore('f').get(id); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null);}catch(e){res(null);} });}
function delFoto(id){return new Promise(res=>{ if(!db) return res(); try{const t=db.transaction('f','readwrite'); t.objectStore('f').delete(id); t.oncomplete=()=>res(); t.onerror=()=>res();}catch(e){res();} });}
function allFotos(){return new Promise(res=>{ const o={}; if(!db) return res(o); try{ const c=db.transaction('f').objectStore('f').openCursor(); c.onsuccess=e=>{const cur=e.target.result; if(cur){o[cur.key]=cur.value;cur.continue();}else res(o);}; c.onerror=()=>res(o);}catch(e){res(o);} });}
function comprimir(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const k=Math.min(1,900/Math.max(im.width,im.height));
        const w=Math.round(im.width*k), h=Math.round(im.height*k);
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(im,0,0,w,h);
        res(c.toDataURL('image/jpeg',0.6));
      };
      im.onerror=rej; im.src=fr.result;
    };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}
const driveUrl=id=>'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w1200';

/* ============ UTILIDADES ============ */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'$'+(Math.round(n*100)/100).toLocaleString('es-AR',{maximumFractionDigits:2});
const uid=()=>'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
function nowLocal(){const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16);}
function p2(n){return String(n).padStart(2,'0');}
function fechaCorta(f){const d=new Date(f); if(isNaN(d)) return f; return `${DIAS[d.getDay()]} ${p2(d.getDate())}/${p2(d.getMonth()+1)} ${p2(d.getHours())}:${p2(d.getMinutes())}`;}
function diaLargo(k){const d=new Date(k+'T12:00'); return isNaN(d)?k:`${DIAS[d.getDay()]} ${p2(d.getDate())}/${p2(d.getMonth()+1)}`;}
function parseMonto(v){ v=String(v).trim().replace(/\s/g,''); if(v.includes(',')) v=v.replace(/\./g,'').replace(',','.'); else if((v.match(/\./g)||[]).length>1 || /\.\d{3}$/.test(v)) v=v.replace(/\./g,''); return parseFloat(v); }
let tmr; function toast(t){const e=$('toast'); e.textContent=t; e.classList.add('show'); clearTimeout(tmr); tmr=setTimeout(()=>e.classList.remove('show'),2200);}
function openModal(h){$('sheet').innerHTML=h; $('modal').classList.remove('hidden'); $('sheet').scrollTop=0;}
function closeModal(){$('modal').classList.add('hidden'); $('sheet').innerHTML='';}
function totales(){let i=0,e=0; vivos().forEach(m=>{ if(m.tipo==='ingreso') i+=m.monto; else e+=m.monto; }); return {i,e,s:i-e};}
function totalArea(id){return vivos().filter(m=>m.areaId===id).reduce((a,m)=>a+m.monto,0);}
function iconOf(m){const a=(S.areas[m.tipo]||[]).find(x=>x.id===m.areaId); return a?a.icono:'moneda';}

/* ============ SINCRONIZACIÓN CON EL SHEET ============ */
let online=false;
let LAST=null;   // diagnóstico del último intento de conexión
function call(action,params,timeout){
  return new Promise(res=>{
    if(!CFG.url) return res(null);
    const cb='cb'+Math.random().toString(36).slice(2);
    const s=document.createElement('script');
    let done=false, t, len=0;
    const fin=(v,why)=>{
      if(done) return; done=true; clearTimeout(t); window[cb]=function(){}; s.remove();
      LAST={a:action,len:len,t:Date.now(),r: v===null?(why||'sin respuesta'):(v&&v.ok?'ok':'error: '+(v&&v.err))};
      res(v);
    };
    window[cb]=d=>fin(d);
    s.onerror=()=>fin(null,'error de carga');
    t=setTimeout(()=>fin(null,'sin respuesta (15 s)'),timeout||15000);
    const q=new URLSearchParams(Object.assign({action:action,k:CFG.key,callback:cb,_:Date.now()},params||{}));
    s.src=CFG.url+'?'+q.toString(); len=s.src.length;
    document.head.appendChild(s);
  });
}
function wire(m){
  return {id:m.id,f:m.fecha,t:m.tipo,a:m.areaNombre,ai:m.areaId,m:m.monto,r:m.rinde,
          d:(m.detalle||'').slice(0,120),c:m.cargo||'',x:m.del?1:0,u:m.upd,fx:m.fclear?1:0};
}
const limpio=x=>String(x==null?'':x).replace(/[|~]/g,' ');
const areasCompact=()=>[].concat(
  S.areas.ingreso.map(a=>['i',a.id,limpio(a.nombre),a.icono].join('~')),
  S.areas.egreso.map(a=>['e',a.id,limpio(a.nombre),a.icono].join('~'))).join('|');
function marcar(m){ m.upd=Date.now(); S.pend[m.id]=1; }
function pendientes(){ return Object.keys(S.pend).length + (S.areasDirty?1:0) + vivos().filter(m=>m.foto&&!m.fotoId).length; }

let flushing=false, areasNext=0;
async function flush(){
  if(flushing||!CFG.url||RO) return;
  flushing=true;
  try{
    if(S.areasDirty && Date.now()>=areasNext){
      const r=await call('areas',{d:areasCompact()});
      if(r&&r.ok){ S.areasDirty=false; S.asrv=r.asrv; save(); online=true; }
      else areasNext=Date.now()+20000;      // reintenta en 20 s, sin frenar los movimientos
    }
    for(const id of Object.keys(S.pend)){
      const m=S.movs.find(x=>x.id===id);
      if(!m){ delete S.pend[id]; continue; }
      const sent=m.upd;
      const r=await call('up',{d:JSON.stringify(wire(m))});
      if(r&&r.ok){ if(m.upd===sent){ delete S.pend[id]; m.fclear=0; } save(); online=true; }
      else { online=false; return; }
    }
  } finally { flushing=false; updateStatus(); }
}
function aplicar(w){
  const i=S.movs.findIndex(x=>x.id===w.id), old=i>=0?S.movs[i]:null;
  const n={id:w.id,fecha:w.f,tipo:w.t,areaNombre:w.a,areaId:w.ai,monto:w.m,rinde:w.r,detalle:w.d,
           cargo:w.c,del:w.x?1:0,upd:w.u,fotoId:w.fid||'',foto:old?!!old.foto:false,fotoTry:old?old.fotoTry:0};
  if(old && old.fotoId && !n.fotoId) n.foto=false;   // alguien sacó el comprobante
  if(i>=0) S.movs[i]=n; else S.movs.push(n);
}
let polling=false;
async function poll(){
  if(polling||!CFG.url) return;
  polling=true;
  try{
    const r=await call('get',{since:S.srv||0,asrv:S.asrv||0});
    if(!r||!r.ok){ online=false; return; }
    online=true;
    let ch=false;
    (r.movs||[]).forEach(w=>{
      if(w.srv>S.srv) S.srv=w.srv;
      if(S.pend[w.id]) return;              // lo local pendiente gana
      aplicar(w); ch=true;
    });
    if(r.asrv===0){ if(!RO && !S.areasDirty){ S.areasDirty=true; } }
    else if(r.areas && r.asrv>S.asrv && !S.areasDirty){
      S.areas={ingreso:[],egreso:[]};
      r.areas.forEach(a=>{ if(S.areas[a[0]]) S.areas[a[0]].push({id:a[1],nombre:a[2],icono:a[3]}); });
      S.asrv=r.asrv; ch=true;
    }
    save();
    if(ch && $('modal').classList.contains('hidden')) render();
  } finally { polling=false; updateStatus(); }
}
let upBusy=false;
function postFoto(id,d){
  const f=document.createElement('form'); f.method='POST'; f.action=CFG.url; f.target='upif'; f.style.display='none';
  [['k',CFG.key],['id',id],['img',d]].forEach(p=>{ const i=document.createElement('input'); i.type='hidden'; i.name=p[0]; i.value=p[1]; f.appendChild(i); });
  document.body.appendChild(f); f.submit(); setTimeout(()=>f.remove(),4000);
}
async function fotoLoop(){
  if(upBusy||!CFG.url||RO||!online) return;
  const now=Date.now();
  const m=S.movs.find(x=>!x.del&&x.foto&&!x.fotoId&&!S.pend[x.id]&&(!x.fotoTry||now-x.fotoTry>40000));
  if(!m) return;
  upBusy=true; m.fotoTry=now; save();
  const d=await getFoto(m.id);
  if(d&&String(d).startsWith('data:')) postFoto(m.id,d); else { m.foto=false; save(); }
  setTimeout(()=>{upBusy=false; updateStatus();},6000);
}
function updateStatus(){
  const e=$('st'); if(!e) return;
  const n=pendientes(); let t,c;
  if(!CFG.url){ t='Solo este teléfono'; c='off'; }
  else if(!online){ t='Sin conexión'+(n?` · ${n} sin subir`:''); c='bad'; }
  else if(n && !RO){ t=`Subiendo ${n}…`; c='warn'; }
  else { t=RO?'En vivo · solo ver':'En vivo'; c='ok'; }
  e.textContent='● '+t; e.className='st '+c;
}
function syncNow(){
  if(!CFG.url) return ajustes();
  toast('Sincronizando…'); poll(); flush();
}
function startSync(){
  updateStatus();
  if(!CFG.url) return;
  poll(); flush();
  setInterval(()=>{ if(!document.hidden) poll(); },6000);
  setInterval(()=>{ flush(); fotoLoop(); updateStatus(); },4000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ poll(); flush(); } });
  window.addEventListener('online',()=>{ poll(); flush(); });
}

function descargar(nombre,blob){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nombre;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500);

function exportCSV(){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  let c='Fecha,Tipo,Área,Monto,Rendido por,Detalle,Cargó,Comprobante\n';
  ordenados().reverse().forEach(m=>{ c+=[q(m.fecha.replace('T',' ')),q(m.tipo),q(m.areaNombre),m.monto,q(m.rinde),q(m.detalle),q(m.cargo),q((m.foto||m.fotoId)?'Sí':'No')].join(',')+'\n'; });
  descargar('caja_encuentro.csv',new Blob(['\ufeff'+c],{type:'text/csv;charset=utf-8'}));
}
async function backup(){
  const fotos=await allFotos();
  descargar('backup_caja_encuentro_'+nowLocal().replace(/[:T]/g,'-')+'.json',new Blob([JSON.stringify({app:'emb21',data:S,fotos})],{type:'application/json'}));

}
function restaurar(inp){
  const f=inp.files[0]; if(!f) return;
  const fr=new FileReader();
  fr.onload=async()=>{
    try{
      const j=JSON.parse(fr.result);
      if(!j.data||!j.data.areas||!j.data.movs) throw 0;
      if(!confirm('Esto reemplaza lo cargado en ESTE teléfono por el backup ('+j.data.movs.length+' movimientos) y lo vuelve a subir al Sheet. ¿Seguro?')) return;
      S=normalizar(j.data); S.srv=0; S.asrv=0; S.pend={}; S.areasDirty=true; S.movs.forEach(m=>{S.pend[m.id]=1;});
      save();
      for(const [id,d] of Object.entries(j.fotos||{})) await putFoto(id,d);
      render(); flush(); toast('Backup restaurado');
    }catch(e){ toast('Ese archivo no es un backup válido'); }
  };
  fr.readAsText(f); inp.value='';
}

    <button type="button" class="btn ghost" onclick="$('f_file').click()">📷 Subir comprobante</button>
    <div id="f_foto"></div>
    <div class="row"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" id="f_ok" onclick="guardarMov('${movId}','${areaId}','${t}')">Guardar</button></div>`);
  if(m&&(m.foto||m.fotoId)){
    (m.foto?getFoto(m.id):Promise.resolve(null)).then(d=>{ d=d||(m.fotoId?driveUrl(m.fotoId):null); if(d&&!F.changed){F.data=d; showFoto(d);} });
  }
  if(!m) setTimeout(()=>{const e=$('f_monto'); if(e) e.focus();},250);
}
async function onFoto(inp){
  const f=inp.files[0]; if(!f) return;
  try{ F.data=await comprimir(f); F.changed=true; showFoto(F.data); }catch(e){ toast('No se pudo leer la imagen'); }
  inp.value='';
}
function showFoto(d){ const e=$('f_foto'); if(e) e.innerHTML=d?`<div class="fp"><img src="${d}" alt="Comprobante"><button type="button" class="btn ghost sm" onclick="quitarFoto()">Quitar</button></div>`:''; }
function quitarFoto(){F.data=null; F.changed=true; showFoto(null);}

async function guardarMov(movId,areaId,t){
  if(saving) return;
  const monto=parseMonto($('f_monto').value), rinde=$('f_rinde').value.trim(), det=$('f_det').value.trim(), fecha=$('f_fecha').value||nowLocal();
  if(!(monto>0)) return toast('Ingresá el monto');
  if(!rinde) return toast('Falta quién lo rinde');
  saving=true; $('f_ok').disabled=true;
  let m;
  if(movId){ m=S.movs.find(x=>x.id===movId); }
  else{
    const a=S.areas[t].find(x=>x.id===areaId);
    m={id:uid(),tipo:t,areaId:areaId,areaNombre:a.nombre,foto:false,fotoId:'',del:0}; S.movs.push(m);
  }
  Object.assign(m,{fecha,monto,rinde,detalle:det,cargo:CFG.dev||m.cargo||''});
  if(F.changed){
    m.fclear=1; m.fotoId='';
    if(F.data){ const ok=await putFoto(m.id,F.data); m.foto=ok; m.fotoTry=0; if(!ok) toast('⚠️ El comprobante no se pudo guardar'); }
    else{ await delFoto(m.id); m.foto=false; }
  }
  marcar(m);
  S.personas=[rinde].concat(S.personas.filter(p=>p.toLowerCase()!==rinde.toLowerCase())).slice(0,20);
  save(); closeModal(); render(); toast('✓ Guardado'); flush();
}

async function detalle(id){
  const m=S.movs.find(x=>x.id===id); if(!m) return;
  const ing=m.tipo==='ingreso', tiene=(m.foto||m.fotoId);
  openModal(`<div class="fh">${icon(iconOf(m),46)}<div><small>${ing?'INGRESO':'EGRESO'}</small><h3>${esc(m.areaNombre)}</h3></div><button class="x2" onclick="closeModal()">✕</button></div>
    <div class="kv"><span>Monto</span><b class="${ing?'pos':'neg'}">${fmt(m.monto)}</b></div>
    <div class="kv"><span>Fecha</span><span>${fechaCorta(m.fecha)}</span></div>
    <div class="kv"><span>${ing?'Rendido por':'Pagado por'}</span><span>${esc(m.rinde)}</span></div>
    ${m.detalle?`<div class="kv"><span>Detalle</span><span>${esc(m.detalle)}</span></div>`:''}
    ${m.cargo?`<div class="kv"><span>Cargó</span><span>${esc(m.cargo)}</span></div>`:''}
    <div id="d_foto">${tiene?'<div class="empty">Cargando comprobante…</div>':'<div class="empty">Sin comprobante</div>'}</div>
    ${RO?`<div class="row"><button class="btn ghost" onclick="closeModal()">Cerrar</button></div>`:
    `<div class="row"><button class="btn del" onclick="borrarMov('${m.id}')">Eliminar</button><button class="btn" onclick="tipo='${m.tipo}';movForm('${m.id}','')">Editar</button></div>`}`);
  if(tiene){
    let d=null; if(m.foto) d=await getFoto(id); if(!d&&m.fotoId) d=driveUrl(m.fotoId);
    const e=$('d_foto'); if(e) e.innerHTML=d?`<img class="fimg" src="${d}" alt="Comprobante">`:'<div class="empty">El comprobante está en otro teléfono y todavía no se subió</div>';
  }
}
async function borrarMov(id){
  if(!confirm('¿Eliminar este movimiento? Se saca de la caja y del resumen.')) return;
  const m=S.movs.find(x=>x.id===id); if(!m) return;
  m.del=1; m.fclear=1; m.fotoId=''; m.foto=false; await delFoto(id); marcar(m);
  save(); closeModal(); render(); toast('Eliminado'); flush();
}

/* ============ INICIO ============ */
render();
openDB().then(()=>{ render(); startSync(); preguntarNombre(); });
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist();
</script>
